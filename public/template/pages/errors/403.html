<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uroo UI - 403 Forbidden</title>
  <script src="../../assets/js/tailwind.js"></script>
  <script src="../../assets/js/lucide.js"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{glass:{light:'rgba(255,255,255,0.65)','light-border':'rgba(255,255,255,0.8)',dark:'rgba(18,18,20,0.65)','dark-border':'rgba(255,255,255,0.1)'}}}}}</script>
  <link rel="stylesheet" href="../../assets/css/uroo.css">
  <style>
    .u-bg{position:fixed;inset:0;z-index:-10;transition:opacity .35s ease}
    .u-bg-light{background:linear-gradient(135deg,#dfe3ea,#f4f4f5)}
    .u-bg-dark{background:linear-gradient(135deg,#0a0a0b,#1a1a1e);opacity:0}
    body.dark .u-bg-light{opacity:0}
    body.dark .u-bg-dark{opacity:1}
    .u-glow{position:fixed;border-radius:9999px;filter:blur(90px);z-index:-9;pointer-events:none;background:rgba(0,0,0,0.06);transition:background-color .35s ease}
    body.dark .u-glow{background:rgba(255,255,255,0.05)}
    .u-glow-1{width:420px;height:420px;top:-140px;left:-140px}
    .u-glow-2{width:520px;height:520px;bottom:-200px;right:-140px}
    .u-glow-3{width:300px;height:300px;top:42%;left:58%}
  </style>
</head>
<body class="min-h-screen font-sans antialiased text-zinc-800 dark:text-zinc-100">
  <script>(function initTheme(){var saved=null;try{saved=localStorage.getItem('uroo-theme')}catch(e){};var dark=(saved==='dark')||(!saved&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);var de=document.documentElement;if(dark){de.classList.add('dark');de.classList.remove('light');if(document.body){document.body.classList.add('dark');document.body.classList.remove('light');}}else{de.classList.remove('dark');de.classList.add('light');if(document.body){document.body.classList.remove('dark');document.body.classList.add('light');}}})();</script>

  <div class="u-bg u-bg-light"></div>
  <div class="u-bg u-bg-dark"></div>
  <div class="u-glow u-glow-1"></div>
  <div class="u-glow u-glow-2"></div>
  <div class="u-glow u-glow-3"></div>

  <button onclick="toggleTheme()" class="glass-panel fixed right-4 top-4 z-50 inline-flex items-center justify-center rounded-full p-2.5" aria-label="Ganti tema">
    <i data-lucide="sun" class="h-5 w-5 text-zinc-700 dark:hidden"></i>
    <i data-lucide="moon" class="hidden h-5 w-5 text-zinc-200 dark:block"></i>
  </button>

  <main class="relative mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center px-6 py-16 text-center">
    <div class="glass-panel anim-slide-up w-full rounded-3xl p-8 md:p-12">
      <div class="relative mx-auto mb-8 flex h-24 w-24 items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-zinc-400/20 blur-xl dark:bg-zinc-300/10"></div>
        <div class="relative flex h-20 w-20 items-center justify-center rounded-full border border-zinc-200/80 bg-white/70 dark:border-white/10 dark:bg-zinc-800/70">
          <i data-lucide="lock" class="h-9 w-9 text-zinc-600 dark:text-zinc-200"></i>
        </div>
      </div>

      <p class="text-xs font-semibold uppercase tracking-[0.3em] text-zinc-500 dark:text-zinc-500">Error 403</p>
      <h1 class="mt-4 text-4xl font-black tracking-tight text-zinc-900 dark:text-zinc-50 md:text-5xl">
        Anda tidak memiliki akses
      </h1>
      <p class="mx-auto mt-3 max-w-md text-sm leading-relaxed text-zinc-500 dark:text-zinc-400">
        Halaman ini dilindungi dan hanya dapat diakses oleh anggota dengan izin tertentu.
        Jika Anda merasa ini terjadi karena kesalahan, mintalah akses dari administrator.
      </p>

      <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
        <button onclick="requestAccess()" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-zinc-900 px-6 py-3 text-sm font-semibold text-white transition-colors hover:bg-zinc-700 sm:w-auto dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-white">
          <i data-lucide="key-round" class="h-4 w-4"></i>Minta akses
        </button>
        <a href="../../index.html" class="glass-panel inline-flex w-full items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm font-semibold text-zinc-700 transition-colors hover:bg-white/70 sm:w-auto dark:text-zinc-200 dark:hover:bg-white/5">
          <i data-lucide="arrow-left" class="h-4 w-4"></i>Kembali ke beranda
        </a>
      </div>

      <div class="mx-auto mt-10 max-w-lg space-y-3 text-left">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-zinc-500 dark:text-zinc-500">Bantuan yang mungkin berguna</p>
        <button onclick="handleHelp('Akun')" class="glass-panel flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm transition-colors hover:bg-white/70 dark:hover:bg-white/5">
          <i data-lucide="user" class="h-4 w-4 shrink-0 text-zinc-400 dark:text-zinc-500"></i>
          <span>Periksa apakah Anda sudah masuk ke akun yang benar</span>
          <i data-lucide="chevron-right" class="ml-auto h-4 w-4 shrink-0 text-zinc-400 dark:text-zinc-500"></i>
        </button>
        <button onclick="handleHelp('Peran')" class="glass-panel flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm transition-colors hover:bg-white/70 dark:hover:bg-white/5">
          <i data-lucide="shield-check" class="h-4 w-4 shrink-0 text-zinc-400 dark:text-zinc-500"></i>
          <span>Hubungi administrator untuk menambah peran atau izin Anda</span>
          <i data-lucide="chevron-right" class="ml-auto h-4 w-4 shrink-0 text-zinc-400 dark:text-zinc-500"></i>
        </button>
        <button onclick="handleHelp('Dokumentasi')" class="glass-panel flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm transition-colors hover:bg-white/70 dark:hover:bg-white/5">
          <i data-lucide="book-open" class="h-4 w-4 shrink-0 text-zinc-400 dark:text-zinc-500"></i>
          <span>Baca dokumentasi manajemen akses untuk detail lebih lanjut</span>
          <i data-lucide="chevron-right" class="ml-auto h-4 w-4 shrink-0 text-zinc-400 dark:text-zinc-500"></i>
        </button>
      </div>
    </div>

    <footer class="relative mt-8 flex flex-col items-center gap-2 text-xs text-zinc-500 dark:text-zinc-500 sm:flex-row sm:gap-6">
      <span>Uroo UI - Akses ditolak</span>
      <span class="hidden h-3 w-px bg-zinc-400/40 sm:block dark:bg-white/10"></span>
      <span>Hak akses: Terbatas</span>
      <span class="hidden h-3 w-px bg-zinc-400/40 sm:block dark:bg-white/10"></span>
      <span id="year"></span>
    </footer>
  </main>

  <script>
    lucide.createIcons();
    function toggleTheme(){const h=document.documentElement,b=document.body;h.classList.toggle('dark');b.classList.toggle('dark');try{localStorage.setItem('uroo-theme',h.classList.contains('dark')?'dark':'light')}catch(e){};lucide.createIcons();}
    document.getElementById('year').textContent = 'Uroo Dev - ' + new Date().getFullYear();

    function requestAccess(){
      showToast('Permintaan akses terkirim ke administrator. Kami akan memberi kabar lewat email.');
    }
    function handleHelp(topic){
      showToast('Membuka bantuan: ' + topic);
    }
    function showToast(msg){
      const t=document.createElement('div');
      t.className='glass-panel anim-toast-in fixed bottom-6 left-1/2 z-[80] -translate-x-1/2 rounded-xl px-4 py-3 text-sm font-medium text-zinc-800 dark:text-zinc-100';
      t.textContent=msg;
      document.body.appendChild(t);
      setTimeout(()=>{t.style.transition='all .3s';t.style.opacity='0';t.style.transform='translate(-50%,8px)';setTimeout(()=>t.remove(),320);},2400);
    }
  </script>
<script src="../../assets/js/uroo-nav.js"></script>
</body>
</html>
