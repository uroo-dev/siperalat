<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan ke Laporan Keuangan...</title>
  <meta http-equiv="refresh" content="0; url=finance.html#laporan">
  <script>
    (function () {
      var saved = null; try { saved = localStorage.getItem('uroo-theme'); } catch (e) {}
      var dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var el = document.documentElement;
      el.classList.add(dark ? 'dark' : 'light');
      el.classList.remove(dark ? 'light' : 'dark');
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: #f4f4f5; color: #18181b;
      transition: background-color .3s ease, color .3s ease;
    }
    body.dark { background: #0a0a0b; color: #fafafa; }
    .card {
      display: flex; flex-direction: column; align-items: center; gap: .75rem;
      padding: 2rem 2.5rem; border-radius: 1.5rem; text-align: center;
      background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 20px 40px -15px rgba(0,0,0,.05), inset 0 1px 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    }
    body.dark .card {
      background: rgba(24,24,27,.55); border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 40px -15px rgba(0,0,0,.5), inset 0 1px 1px 0 rgba(255,255,255,.1);
    }
    .dot { width: 14px; height: 14px; border-radius: 999px; border: 2.5px solid currentColor; animation: spin 1s linear infinite; opacity:.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .txt { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; opacity: .6; }
    a { color: #0891b2; text-decoration: underline; }
    body.dark a { color: #22d3ee; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <div class="txt">Mengarahkan ke Laporan Keuangan...</div>
    <div class="sub">Memuat modul, sebentar&hellip;</div>
    <a href="finance.html#laporan">Klik di sini jika tidak beralih otomatis</a>
  </div>
  <script src="../../assets/js/uroo-nav.js"></script>
</body>
</html>
